name: Fan Controlled Football
description: Fan Controlled Football (FCF) was a professional indoor American football league in which
  fans voted on play calls in real time through a mobile app, playing a fast, 7-on-7 format staged at
  Pullman Yards in Atlanta and streamed to social and live-video audiences. The league drew high-profile
  athlete and celebrity team owners and investors and positioned itself as a fan-interactive, tech-driven
  sports and entertainment property. It was surfaced as a portfolio company of Lightspeed Venture Partners
  and added to the API Evangelist network. FCF paused operations and its public web presence (fcf.io) no
  longer serves a live site, so it currently exposes no developer portal, documentation, or API surface.
